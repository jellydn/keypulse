<svg xmlns="http://www.w3.org/2000/svg" width="460" height="340" viewBox="0 0 460 340">
  <defs>
    <linearGradient id="titleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="tabActive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <linearGradient id="tabInactive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8d8d8"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Window shadow and background -->
  <rect x="4" y="4" width="452" height="332" rx="10" ry="10" fill="#000" opacity="0.15"/>
  <rect x="0" y="0" width="452" height="332" rx="10" ry="10" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="452" height="28" rx="10" ry="10" fill="url(#titleBg)"/>
  <rect x="0" y="18" width="452" height="10" fill="url(#titleBg)"/>
  <circle cx="14" cy="14" r="5" fill="#ff5f57" stroke="#e04530" stroke-width="0.5"/>
  <circle cx="28" cy="14" r="5" fill="#febc2e" stroke="#d4a020" stroke-width="0.5"/>
  <circle cx="42" cy="14" r="5" fill="#28c840" stroke="#1fa032" stroke-width="0.5"/>
  <text x="226" y="18" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#cccccc" text-anchor="middle" dominant-baseline="central">KeyPulse Preferences</text>

  <!-- Tab bar area -->
  <rect x="0" y="28" width="452" height="34" fill="#d0d0d0"/>
  <line x1="0" y1="62" x2="452" y2="62" stroke="#b0b0b0" stroke-width="1"/>

  <!-- Tab items -->
  <!-- General tab (active) -->
  <rect x="120" y="34" width="66" height="24" rx="8" fill="url(#tabActive)"/>
  <text x="153" y="49" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">General</text>

  <!-- Sounds tab (active) -->
  <rect x="192" y="34" width="66" height="24" rx="8" fill="url(#tabActive)"/>
  <text x="225" y="49" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">Sounds</text>

  <!-- Advanced tab (active) -->
  <rect x="264" y="34" width="82" height="24" rx="8" fill="url(#tabActive)"/>
  <text x="305" y="49" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f" text-anchor="middle" dominant-baseline="central">Advanced</text>

  <!-- Content area -->
  <rect x="0" y="62" width="452" height="270" fill="#f5f5f7"/>

  <!-- Sounds tab content (most detailed) -->
  <!-- Sound Profile section -->
  <text x="24" y="86" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Sound Profile</text>
  <rect x="24" y="94" width="404" height="44" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/>
  <!-- Segmented control -->
  <rect x="36" y="102" width="114" height="28" rx="6" fill="#007aff"/>
  <text x="93" y="116" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Linear</text>
  <rect x="150" y="102" width="114" height="28" rx="6" fill="#e5e5ea"/>
  <text x="207" y="116" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" font-weight="500" fill="#1d1d1f" text-anchor="middle">Tactile</text>
  <rect x="264" y="102" width="114" height="28" rx="6" fill="#e5e5ea"/>
  <text x="321" y="116" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" font-weight="500" fill="#1d1d1f" text-anchor="middle">Clicky</text>

  <!-- Volume section -->
  <text x="24" y="158" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Volume</text>
  <rect x="24" y="166" width="404" height="40" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/>
  <!-- Slider track -->
  <rect x="36" y="178" width="320" height="6" rx="3" fill="#e5e5ea"/>
  <rect x="36" y="178" width="224" height="6" rx="3" fill="#007aff"/>
  <!-- Slider thumb -->
  <circle cx="260" cy="181" r="9" fill="#ffffff" stroke="#b0b0b0" stroke-width="1"/>
  <circle cx="260" cy="181" r="3" fill="#007aff"/>
  <!-- Percentage label -->
  <text x="396" y="184" font-family="'SF Mono', Menlo, monospace" font-size="13" fill="#1d1d1f" text-anchor="end">70%</text>

  <!-- Toggles section -->
  <text x="24" y="226" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Options</text>
  <rect x="24" y="234" width="404" height="54" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/>
  <!-- Mute toggle -->
  <text x="36" y="252" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="13" fill="#1d1d1f">Mute</text>
  <rect x="394" y="243" width="28" height="18" rx="9" fill="#e5e5ea"/>
  <circle cx="409" cy="252" r="7" fill="#ffffff" stroke="#b0b0b0" stroke-width="0.5"/>
  <!-- Pitch Variation toggle -->
  <text x="36" y="276" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="13" fill="#1d1d1f">Pitch Variation</text>
  <rect x="394" y="267" width="28" height="18" rx="9" fill="#007aff"/>
  <circle cx="409" cy="276" r="7" fill="#ffffff" stroke="#007aff" stroke-width="1.5"/>

  <!-- Test Sound button -->
  <rect x="36" y="304" width="100" height="28" rx="6" fill="#007aff"/>
  <text x="86" y="318" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Test Sound</text>

  <!-- Status bar / footer -->
  <line x1="0" y1="314" x2="452" y2="314" stroke="#d0d0d0" stroke-width="1"/>
  <text x="226" y="326" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="10" fill="#888888" text-anchor="middle">KeyPulse v0.1.0 (Build 1)</text>
</svg>
