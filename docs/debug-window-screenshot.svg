<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420">
  <defs>
    <linearGradient id="titleBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#1e1e1e"/>
    </linearGradient>
    <linearGradient id="sectionBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f8f8"/>
    </linearGradient>
  </defs>

  <!-- Window background -->
  <rect x="0" y="0" width="360" height="420" rx="10" ry="10" fill="#1e1e1e" stroke="#3d3d3d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="360" height="28" rx="10" ry="10" fill="url(#titleBg)"/>
  <rect x="0" y="18" width="360" height="10" fill="url(#titleBg)"/>
  <circle cx="14" cy="14" r="5" fill="#ff5f57" stroke="#e04530" stroke-width="0.5"/>
  <circle cx="28" cy="14" r="5" fill="#febc2e" stroke="#d4a020" stroke-width="0.5"/>
  <circle cx="42" cy="14" r="5" fill="#28c840" stroke="#1fa032" stroke-width="0.5"/>
  <text x="180" y="18" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#cccccc" text-anchor="middle" dominant-baseline="central">KeyPulse Debug</text>

  <!-- Scrollable content area -->
  <rect x="0" y="28" width="360" height="392" fill="#f5f5f7"/>

  <!-- KeyPulse Debug header -->
  <text x="16" y="50" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">KeyPulse Debug</text>
  <text x="16" y="66" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="11" fill="#888888">Live diagnostics and testing</text>

  <!-- Keystrokes section -->
  <text x="16" y="90" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Keystrokes</text>
  <rect x="16" y="98" width="328" height="72" rx="8" fill="url(#sectionBg)" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="28" y="114" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Total:</text>
  <text x="200" y="114" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#1d1d1f" text-anchor="end">1,247</text>
  <text x="28" y="130" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Last Key:</text>
  <text x="200" y="130" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#1d1d1f" text-anchor="end">Space</text>
  <text x="28" y="146" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Code:</text>
  <text x="200" y="146" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#1d1d1f" text-anchor="end">49 (0x31)</text>
  <text x="28" y="162" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="11" fill="#007aff">Type: Regular key</text>

  <!-- Profile &amp; Sample section -->
  <text x="16" y="186" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Profile &amp; Sample</text>
  <rect x="16" y="194" width="328" height="88" rx="8" fill="url(#sectionBg)" stroke="#e0e0e0" stroke-width="0.5"/>
  <!-- Segmented control -->
  <rect x="28" y="200" width="98" height="26" rx="6" fill="#007aff"/>
  <text x="77" y="213" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle">Linear</text>
  <rect x="126" y="200" width="98" height="26" rx="6" fill="#e5e5ea"/>
  <text x="175" y="213" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="11" font-weight="500" fill="#1d1d1f" text-anchor="middle">Tactile</text>
  <rect x="224" y="200" width="98" height="26" rx="6" fill="#e5e5ea"/>
  <text x="273" y="213" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="11" font-weight="500" fill="#1d1d1f" text-anchor="middle">Clicky</text>
  <text x="28" y="240" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Active:</text>
  <text x="200" y="240" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#1d1d1f" text-anchor="end">Linear</text>
  <text x="28" y="256" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Last Sample:</text>
  <text x="200" y="256" font-family="'SF Mono', Menlo, monospace" font-size="11" fill="#1d1d1f" text-anchor="end">2: linear_key_03.wav</text>

  <!-- Latency section -->
  <text x="16" y="298" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Latency (ms)</text>
  <rect x="16" y="306" width="328" height="96" rx="8" fill="url(#sectionBg)" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="28" y="322" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Average:</text>
  <text x="200" y="322" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#28c840" text-anchor="end">1.614</text>
  <text x="28" y="338" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Min:</text>
  <text x="200" y="338" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#1d1d1f" text-anchor="end">~0.000</text>
  <text x="28" y="354" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Max:</text>
  <text x="200" y="354" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#1d1d1f" text-anchor="end">10.692</text>
  <text x="28" y="370" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Samples:</text>
  <text x="200" y="370" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#1d1d1f" text-anchor="end">100</text>
  <text x="28" y="386" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="11" fill="#888888">Target: &lt; 20ms</text>
  <text x="200" y="386" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="11" font-weight="600" fill="#28c840" text-anchor="end">✅ PASS</text>

  <!-- Modifier Flags section -->
  <text x="16" y="418" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Modifier Flags</text>
  <rect x="16" y="426" width="328" height="44" rx="8" fill="url(#sectionBg)" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="28" y="432" width="32" height="32" rx="6" fill="#e5e5ea"/>
  <text x="44" y="448" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#888888" text-anchor="middle">⇧</text>
  <rect x="68" y="432" width="32" height="32" rx="6" fill="#e5e5ea"/>
  <text x="84" y="448" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#888888" text-anchor="middle">⌘</text>
  <rect x="108" y="432" width="32" height="32" rx="6" fill="#007aff"/>
  <text x="124" y="448" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">⌥</text>
  <rect x="148" y="432" width="32" height="32" rx="6" fill="#e5e5ea"/>
  <text x="164" y="448" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="16" font-weight="700" fill="#888888" text-anchor="middle">⌃</text>

  <!-- Settings section -->
  <text x="16" y="486" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Settings</text>
  <rect x="16" y="494" width="328" height="80" rx="8" fill="url(#sectionBg)" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="28" y="510" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Volume:</text>
  <text x="200" y="510" font-family="'SF Mono', Menlo, monospace" font-size="12" fill="#1d1d1f" text-anchor="end">65%</text>
  <text x="28" y="526" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Muted:</text>
  <text x="200" y="526" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#28c840" text-anchor="end">No</text>
  <text x="28" y="542" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Pitch Var:</text>
  <text x="200" y="542" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#28c840" text-anchor="end">On</text>
  <text x="28" y="558" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f">Enabled:</text>
  <text x="200" y="558" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#28c840" text-anchor="end">Yes</text>

  <!-- Actions section -->
  <text x="16" y="590" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1d1d1f">Actions</text>
  <rect x="16" y="598" width="328" height="52" rx="8" fill="url(#sectionBg)" stroke="#e0e0e0" stroke-width="0.5"/>
  <rect x="28" y="604" width="80" height="28" rx="6" fill="#007aff"/>
  <text x="68" y="618" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Test Sound</text>
  <rect x="116" y="604" width="80" height="28" rx="6" fill="#007aff"/>
  <text x="156" y="618" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" font-weight="500" fill="#ffffff" text-anchor="middle">Test All</text>
  <rect x="204" y="604" width="80" height="28" rx="6" fill="#f5f5f7" stroke="#c0c0c0" stroke-width="0.5"/>
  <text x="244" y="618" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="12" fill="#1d1d1f" text-anchor="middle">Reset Stats</text>
  <rect x="292" y="604" width="40" height="28" rx="6" fill="#f5f5f7" stroke="#c0c0c0" stroke-width="0.5"/>
  <text x="312" y="618" font-family="-apple-system, 'SF Pro Display', Helvetica, sans-serif" font-size="11" fill="#1d1d1f" text-anchor="middle">📋</text>
</svg>
